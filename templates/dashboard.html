<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Dashboard</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="container">
        <div class="login-card">
            <h1>Welcome!</h1>

            <p>You are successfully logged in.</p>

            <h3>Student: {{ username }}</h3>

            <p>Your session is currently active.</p>

<p id="timer">Your session expires in 60 seconds.</p>

<script>
    let remainingTime = {{ remaining_time | int }};

    const timer = document.getElementById("timer");

    const countdown = setInterval(function () {
        remainingTime--;

        if (remainingTime <= 0) {
            clearInterval(countdown);
            timer.textContent = "Session expired. Logging out...";
            window.location.href = "/logout";
        } else {
            timer.textContent =
                "Your session expires in " + remainingTime + " seconds.";
        }
    }, 1000);
</script>

            <br>
            <a href="/logout" style="display: block; width: fit-content; margin-left: auto; margin-right: auto; padding: 10px 20px; background-color: #dc3545; color: black; 
                text-decoration: none; border-radius: 5px; font-weight: bold; text-align: center; margin-top: 15px;">
                Log Out Now
            </a>

            <p class="footer">
                Web Session Demonstration Project
            </p>
        </div>
    </div>
</body>
</html>
