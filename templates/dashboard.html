<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Dashboard</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="container">
        <div class="login-card">
            <h1>Welcome!</h1>

            <p>You are successfully logged in.</p>

            <h3>Student: {{ username }}</h3>

            <p>Your session is currently active.</p>

            <br>
            <a href="/logout" style="display: inline-block; padding: 10px 20px; background-color: #dc3545; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; text-align: center; margin-top: 15px;">
                Log Out Now
            </a>

            <p class="footer">
                Web Session Demonstration Project
            </p>
        </div>
    </div>
</body>
</html>
